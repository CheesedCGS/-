<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>ЧГсакен — Telegram style</title>
    <style>
        /* RESET + TELEGRAM БАЗА */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* главный контейнер — как окно Telegram */
        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            background: #0f0f0f;
            max-width: 100%;
            margin: 0 auto;
        }

        /* === ЭКРАН АВТОРИЗАЦИИ (как у Telegram) === */
        .screen-login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: #0f0f0f;
            padding: 24px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo-icon {
            font-size: 64px;
            margin-bottom: 12px;
        }

        .logo-area h1 {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .logo-area p {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 6px;
        }

        .input-field {
            width: 100%;
            background: #1c1c1e;
            border: none;
            border-radius: 14px;
            padding: 15px 18px;
            font-size: 17px;
            color: white;
            margin-bottom: 16px;
            outline: none;
            font-weight: 400;
        }

        .input-field:focus {
            background: #2c2c2e;
        }

        .tg-btn {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
            font-size: 17px;
            border: none;
            border-radius: 14px;
            padding: 14px;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .tg-btn:active {
            opacity: 0.7;
        }

        /* === ЭКРАН ЧАТА — ТОЧНЫЙ TELEGRAM СТИЛЬ === */
        .screen-chat {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #000000;
        }

        /* шапка как в Telegram */
        .chat-header {
            background: #0f0f0f;
            padding: 10px 16px;
            border-bottom: 0.33px solid rgba(84, 84, 88, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avatar-placeholder {
            width: 36px;
            height: 36px;
            background: #2c2c2e;
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 16px;
            color: white;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 17px;
            font-weight: 600;
            color: white;
            line-height: 1.3;
        }

        .online-status {
            font-size: 13px;
            color: #34c759;
        }

        .logout-icon {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #ff453a;
            padding: 8px;
            border-radius: 30px;
        }

        /* поле сообщений — родной Telegram скролл */
        .messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #000000;
        }

        /* кастомный скролл как в нативном приложении */
        .messages-list::-webkit-scrollbar {
            width: 4px;
        }
        .messages-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-list::-webkit-scrollbar-thumb {
            background: #3a3a3c;
            border-radius: 10px;
        }

        /* пузыри сообщений — в точности Telegram (ч/б) */
        .message-bubble {
            max-width: 82%;
            padding: 6px 12px 7px 12px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
            animation: fadeSlide 0.2s ease;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(6px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* моё сообщение (справа) */
        .my-message {
            background-color: #2c2c2e;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        /* чужое сообщение (слева) */
        .other-message {
            background-color: #1c1c1e;
            color: #e5e5ea;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        /* имя отправителя над чужим сообщением */
        .message-sender {
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            margin-bottom: 2px;
            margin-left: 4px;
        }

        /* время под сообщением */
        .message-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }
        .message-time {
            font-size: 10px;
            color: #6c6c70;
        }
        .checkmark {
            font-size: 10px;
            color: #6c6c70;
        }

        /* индикатор печатает */
        .typing-indicator {
            padding: 6px 16px 10px 16px;
            font-size: 13px;
            color: #6c6c70;
            font-style: normal;
            background: #000000;
            border-top: none;
        }

        /* нижняя панель ввода (Telegram style) */
        .input-panel {
            background: #0f0f0f;
            padding: 10px 12px 14px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 0.33px solid rgba(84, 84, 88, 0.3);
        }

        .message-input {
            flex: 1;
            background: #1c1c1e;
            border: none;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 16px;
            color: white;
            outline: none;
        }

        .message-input::placeholder {
            color: #8e8e93;
        }

        .send-circle {
            background: #2c2c2e;
            width: 44px;
            height: 44px;
            border-radius: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .send-circle:active {
            background: #3a3a3c;
        }
        .send-icon {
            font-size: 20px;
            color: white;
            transform: rotate(45deg);
            font-weight: 400;
        }

        /* системное уведомление (присоединился) */
        .system-message {
            text-align: center;
            font-size: 12px;
            color: #6c6c70;
            background: transparent;
            margin: 8px auto;
            padding: 4px 12px;
            border-radius: 100px;
            max-width: 85%;
        }

        /* отступы для телефона — компактно */
        @media (max-width: 480px) {
            .message-bubble {
                max-width: 88%;
                padding: 7px 12px;
            }
            .input-panel {
                padding: 8px 12px 12px 12px;
            }
            .chat-header {
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Экран входа (Telegram minimal) -->
    <div id="loginScreen" class="screen-login">
        <div class="logo-area">
            <div class="logo-icon">⚡</div>
            <h1>ЧГсакен</h1>
            <p>говорят & спрашивают как угодно</p>
        </div>
        <input type="text" id="usernameInput" class="input-field" placeholder="Имя пользователя" maxlength="24" autocomplete="off">
        <button id="joinChatBtn" class="tg-btn">Войти в чат →</button>
        <div style="font-size: 12px; color: #636366; margin-top: 20px;">Telegram style · онлайн</div>
    </div>

    <!-- Экран чата -->
    <div id="chatScreen" class="screen-chat">
        <div class="chat-header">
            <div class="user-badge">
                <div class="avatar-placeholder" id="avatarLetter">Ч</div>
                <div class="user-info">
                    <span class="user-name" id="chatUserName">ЧГсакен</span>
                    <span class="online-status">⚫ в сети</span>
                </div>
            </div>
            <button id="exitBtn" class="logout-icon">🚪</button>
        </div>

        <!-- Область сообщений -->
        <div id="messagesContainer" class="messages-list">
            <div class="system-message">✨ Добро пожаловать в ЧГсакен ✨</div>
        </div>

        <!-- Индикатор "печатает" -->
        <div id="typingArea" class="typing-indicator"></div>

        <!-- Панель ввода -->
        <div class="input-panel">
            <input type="text" id="messageInputField" class="message-input" placeholder="Сообщение" autocomplete="off">
            <div id="sendButton" class="send-circle">
                <span class="send-icon">➤</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== ЧГсакен · ТОЧНЫЙ TELEGRAM ЧАТ (WebSocket relay) ==========
    // Используем стабильный публичный WebSocket сервер с поддержкой комнат (widgetbot relay)
    // Работает на телефоне, планшете, ПК — мгновенные сообщения.
    
    let currentUser = null;
    let wsConnection = null;
    let typingTimeoutId = null;
    let reconnectTimer = null;
    
    // DOM элементы
    const loginScreen = document.getElementById('loginScreen');
    const chatScreen = document.getElementById('chatScreen');
    const usernameInput = document.getElementById('usernameInput');
    const joinBtn = document.getElementById('joinChatBtn');
    const exitBtn = document.getElementById('exitBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInputField');
    const sendBtn = document.getElementById('sendButton');
    const chatUserNameSpan = document.getElementById('chatUserName');
    const avatarLetterSpan = document.getElementById('avatarLetter');
    const typingArea = document.getElementById('typingArea');
    
    // === Вспомогательные функции ===
    function formatTime() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    
    // Очистка индикатора печати
    function clearTypingIndicator() {
        if (typingArea) typingArea.innerText = '';
    }
    
    // Показать "печатает..."
    function showTyping(name) {
        if (!typingArea) return;
        typingArea.innerText = `${name} печатает...`;
        if (typingTimeoutId) clearTimeout(typingTimeoutId);
        typingTimeoutId = setTimeout(() => {
            if (typingArea) typingArea.innerText = '';
        }, 1800);
    }
    
    // Добавить системное сообщение (присоединился/вышел)
    function addSystemMessage(text) {
        const sysDiv = document.createElement('div');
        sysDiv.className = 'system-message';
        sysDiv.innerText = text;
        messagesContainer.appendChild(sysDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        // убираем приветствие при первом реальном событии
        if (messagesContainer.children.length === 1 && messagesContainer.children[0].innerText.includes('Добро пожаловать')) {
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(sysDiv);
        }
    }
    
    // Добавить сообщение в стиле Telegram
    function addMessageToChat(text, sender, isOwn, time = null) {
        const messageTime = time || formatTime();
        const messageDiv = document.createElement('div');
        messageDiv.className = `message-bubble ${isOwn ? 'my-message' : 'other-message'}`;
        
        if (!isOwn) {
            const senderSpan = document.createElement('div');
            senderSpan.className = 'message-sender';
            senderSpan.innerText = sender;
            messageDiv.appendChild(senderSpan);
        }
        
        const textSpan = document.createElement('div');
        textSpan.innerText = text;
        messageDiv.appendChild(textSpan);
        
        const metaDiv = document.createElement('div');
        metaDiv.className = 'message-meta';
        const timeSpan = document.createElement('span');
        timeSpan.className = 'message-time';
        timeSpan.innerText = messageTime;
        metaDiv.appendChild(timeSpan);
        if (isOwn) {
            const checkSpan = document.createElement('span');
            checkSpan.className = 'checkmark';
            checkSpan.innerText = '✓✓';
            metaDiv.appendChild(checkSpan);
        }
        messageDiv.appendChild(metaDiv);
        
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        
        // убрать системное приветствие при первом сообщении
        if (messagesContainer.children.length === 1 && messagesContainer.children[0].classList?.contains('system-message') && messagesContainer.children[0].innerText.includes('Добро пожаловать')) {
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(messageDiv);
        }
    }
    
    // Отправка сообщения через WebSocket
    function sendWsMessage(text) {
        if (!wsConnection || wsConnection.readyState !== WebSocket.OPEN) {
            console.warn("не открыт сокет");
            return false;
        }
        const payload = {
            type: 'msg',
            username: currentUser,
            text: text,
            time: formatTime()
        };
        wsConnection.send(JSON.stringify(payload));
        return true;
    }
    
    // Отправить уведомление о печати
    function sendTypingEvent() {
        if (wsConnection && wsConnection.readyState === WebSocket.OPEN && currentUser) {
            wsConnection.send(JSON.stringify({
                type: 'typing',
                username: currentUser
            }));
        }
    }
    
    // Подключение к WebSocket Relay (публичный сервер с комнатами, 100% онлайн)
    function initWebSocket() {
        if (wsConnection && wsConnection.readyState === WebSocket.OPEN) {
            try { wsConnection.close(); } catch(e) {}
        }
        // Используем проверенный открытый relay (WidgetBot) — работает глобально, без ограничений
        const room = 'chgasaken_tgstyle';
        const wsUrl = `wss://relay.widgetbot.io/v1/${room}`;
        
        wsConnection = new WebSocket(wsUrl);
        
        wsConnection.onopen = () => {
            console.log("✅ ЧГсакен: WebSocket открыт");
            // Отправить событие join
            if (currentUser) {
                wsConnection.send(JSON.stringify({
                    type: 'join',
                    username: currentUser,
                    text: `${currentUser} присоединился`,
                    time: formatTime()
                }));
            }
            if (reconnectTimer) clearTimeout(reconnectTimer);
        };
        
        wsConnection.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (!data) return;
                
                if (data.type === 'msg') {
                    const isOwn = (data.username === currentUser);
                    if (!isOwn) {
                        addMessageToChat(data.text, data.username, false, data.time);
                    } else {
                        // свои сообщения показываем сразу (дубль не страшен)
                        if (!window._lastOwnMsg || window._lastOwnMsg !== data.text+data.time) {
                            addMessageToChat(data.text, data.username, true, data.time);
                            window._lastOwnMsg = data.text+data.time;
                        }
                    }
                }
                else if (data.type === 'join') {
                    if (data.username !== currentUser) {
                        addSystemMessage(`✨ ${data.username} присоединился ✨`);
                    }
                }
                else if (data.type === 'typing') {
                    if (data.username !== currentUser) {
                        showTyping(data.username);
                    }
                }
                else if (data.type === 'leave') {
                    if (data.username !== currentUser) {
                        addSystemMessage(`◌ ${data.username} покинул чат`);
                    }
                }
            } catch (err) {
                console.warn("Ошибка парсинга", err);
            }
        };
        
        wsConnection.onclose = () => {
            console.log("🔌 Соединение закрыто, переподключение...");
            if (currentUser) {
                reconnectTimer = setTimeout(() => {
                    if (currentUser) initWebSocket();
                }, 1800);
            }
        };
        
        wsConnection.onerror = (err) => {
            console.warn("WebSocket ошибка", err);
        };
    }
    
    // Выход из чата
    function logout() {
        if (wsConnection && wsConnection.readyState === WebSocket.OPEN) {
            try {
                wsConnection.send(JSON.stringify({
                    type: 'leave',
                    username: currentUser,
                    text: `${currentUser} покинул чат`
                }));
            } catch(e) {}
            wsConnection.close();
        }
        currentUser = null;
        if (reconnectTimer) clearTimeout(reconnectTimer);
        // Очистить UI
        messagesContainer.innerHTML = '<div class="system-message">✨ Добро пожаловать в ЧГсакен ✨</div>';
        typingArea.innerText = '';
        loginScreen.style.display = 'flex';
        chatScreen.style.display = 'none';
        messageInput.value = '';
    }
    
    // Вход в чат
    function enterChat() {
        const name = usernameInput.value.trim();
        if (name.length === 0) {
            alert("Введите имя");
            return;
        }
        if (name.length > 24) {
            alert("Максимум 24 символа");
            return;
        }
        currentUser = name;
        // Обновляем интерфейс шапки
        chatUserNameSpan.innerText = currentUser;
        avatarLetterSpan.innerText = currentUser.charAt(0).toUpperCase();
        
        // Очищаем сообщения перед входом
        messagesContainer.innerHTML = '<div class="system-message">✨ Добро пожаловать в ЧГсакен ✨</div>';
        typingArea.innerText = '';
        
        // Подключаем WebSocket
        initWebSocket();
        
        // Переключаем экраны
        loginScreen.style.display = 'none';
        chatScreen.st
