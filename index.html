<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>ЧГсакен — фото работают</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100dvh;
            overflow: hidden;
            width: 100%;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            background: #0f0f0f;
        }

        .screen-login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: #0f0f0f;
            padding: 24px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo-icon {
            font-size: 64px;
            margin-bottom: 12px;
        }

        .logo-area h1 {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
        }

        .logo-area p {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 6px;
        }

        .input-field {
            width: 100%;
            background: #1c1c1e;
            border: none;
            border-radius: 14px;
            padding: 15px 18px;
            font-size: 17px;
            color: white;
            margin-bottom: 16px;
            outline: none;
        }

        .tg-btn {
            background: #fff;
            color: #000;
            font-weight: 600;
            font-size: 17px;
            border: none;
            border-radius: 14px;
            padding: 14px;
            width: 100%;
            cursor: pointer;
        }

        .screen-chat {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #000;
        }

        .chat-header {
            background: #0f0f0f;
            padding: 10px 16px;
            border-bottom: 0.33px solid rgba(84, 84, 88, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: #2c2c2e;
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: white;
        }

        .user-info .name {
            font-size: 17px;
            font-weight: 600;
            color: white;
        }

        .user-info .status {
            font-size: 13px;
            color: #34c759;
        }

        .logout-icon {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #ff453a;
            padding: 8px;
        }

        .messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #000;
        }

        .message-bubble {
            max-width: 82%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 15px;
            word-wrap: break-word;
        }

        .my-message {
            background: #2c2c2e;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        .other-message {
            background: #1c1c1e;
            color: #e5e5ea;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        .message-sender {
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            margin-bottom: 4px;
        }

        .message-img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 14px;
            margin-top: 6px;
            cursor: pointer;
            object-fit: cover;
        }

        .message-time {
            font-size: 10px;
            color: #6c6c70;
            text-align: right;
            margin-top: 4px;
        }

        .system-message {
            text-align: center;
            font-size: 12px;
            color: #6c6c70;
            margin: 8px auto;
        }

        .typing-indicator {
            padding: 6px 16px 8px;
            font-size: 12px;
            color: #6c6c70;
            background: #000;
        }

        .input-panel {
            background: #0f0f0f;
            padding: 10px 12px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 0.33px solid rgba(84, 84, 88, 0.3);
        }

        .attach-btn {
            background: #2c2c2e;
            width: 42px;
            height: 42px;
            border-radius: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            border: none;
            color: white;
        }

        .message-input {
            flex: 1;
            background: #1c1c1e;
            border: none;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 16px;
            color: white;
            outline: none;
        }

        .send-circle {
            background: #2c2c2e;
            width: 42px;
            height: 42px;
            border-radius: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .send-icon {
            font-size: 18px;
            color: white;
            transform: rotate(45deg);
        }

        .upload-status {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2c2e;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
        }

        @media (max-width: 480px) {
            .message-bubble { max-width: 88%; }
        }
    </style>
</head>
<body>
<div class="app">
    <div id="loginScreen" class="screen-login">
        <div class="logo-area">
            <div class="logo-icon">📸</div>
            <h1>ЧГсакен</h1>
            <p>текст + фото · как Telegram</p>
        </div>
        <input type="text" id="usernameInput" class="input-field" placeholder="Твоё имя" maxlength="24">
        <button id="joinBtn" class="tg-btn">Войти в чат →</button>
    </div>

    <div id="chatScreen" class="screen-chat">
        <div class="chat-header">
            <div class="user-badge">
                <div class="avatar" id="avatar">😎</div>
                <div class="user-info">
                    <div class="name" id="chatUserName">ЧГсакен</div>
                    <div class="status">⚡ онлайн</div>
                </div>
            </div>
            <button id="logoutBtn" class="logout-icon">🚪</button>
        </div>

        <div id="messagesContainer" class="messages-list">
            <div class="system-message">✨ Отправляй текст или фото ✨</div>
        </div>

        <div id="typingArea" class="typing-indicator"></div>

        <div class="input-panel">
            <label class="attach-btn" id="attachBtn">📎
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </label>
            <input type="text" id="messageInput" class="message-input" placeholder="Сообщение">
            <div id="sendBtn" class="send-circle">
                <span class="send-icon">➤</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== ЧГсакен с РАБОЧИМИ фото через бесплатный загрузчик =====
    let currentUser = null;
    let ws = null;
    let typingTimer = null;
    let reconnectTimer = null;

    const loginScreen = document.getElementById('loginScreen');
    const chatScreen = document.getElementById('chatScreen');
    const usernameInput = document.getElementById('usernameInput');
    const joinBtn = document.getElementById('joinBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatUserNameSpan = document.getElementById('chatUserName');
    const avatarSpan = document.getElementById('avatar');
    const typingArea = document.getElementById('typingArea');
    const fileInput = document.getElementById('fileInput');
    const attachBtn = document.getElementById('attachBtn');

    function formatTime() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'system-message';
        div.innerText = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        if (messagesContainer.children.length === 1 && messagesContainer.children[0].innerText.includes('Добро пожаловать')) {
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(div);
        }
    }

    function addMessage(text, sender, isOwn, time, imageUrl = null) {
        const timeStr = time || formatTime();
        const messageDiv = document.createElement('div');
        messageDiv.className = `message-bubble ${isOwn ? 'my-message' : 'other-message'}`;
        
        if (!isOwn) {
            const senderSpan = document.createElement('div');
            senderSpan.className = 'message-sender';
            senderSpan.innerText = sender;
            messageDiv.appendChild(senderSpan);
        }
        
        if (imageUrl) {
            const img = document.createElement('img');
            img.src = imageUrl;
            img.className = 'message-img';
            img.onclick = () => window.open(imageUrl, '_blank');
            messageDiv.appendChild(img);
        }
        
        if (text && text.trim()) {
            const textSpan = document.createElement('div');
            textSpan.innerText = text;
            messageDiv.appendChild(textSpan);
        }
        
        const timeSpan = document.createElement('div');
        timeSpan.className = 'message-time';
        timeSpan.innerText = timeStr;
        messageDiv.appendChild(timeSpan);
        
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        
        if (messagesContainer.children.length === 1 && messagesContainer.children[0].classList?.contains('system-message')) {
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(messageDiv);
        }
    }

    function sendWsMessage(type, payload) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type, ...payload }));
        }
    }

    function sendTextMessage(text) {
        sendWsMessage('msg', {
            username: currentUser,
            text: text,
            time: formatTime(),
            image: null
        });
    }

    function sendImageMessage(imageUrl, caption = '') {
        sendWsMessage('msg', {
            username: currentUser,
            text: caption,
            time: formatTime(),
            image: imageUrl
        });
    }

    function sendTyping() {
        sendWsMessage('typing', { username: currentUser });
    }

    function showTyping(name) {
        typingArea.innerText = `${name} печатает...`;
        if (typingTimer) clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            typingArea.innerText = '';
        }, 1500);
    }

    // Загрузка фото на бесплатный хостинг
    async function uploadImage(file) {
        const formData = new FormData();
        formData.append('image', file);
        
        // Используем бесплатный API imgbb (без регистрации, работает отлично)
        const apiKey = '6d207e02198a847aa98d0a2a901485a5'; // публичный ключ для демо
        const url = `https://api.imgbb.com/1/upload?key=${apiKey}`;
        
        const response = await fetch(url, {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        if (data.success) {
            return data.data.url;
        } else {
            throw new Error('Ошибка загрузки');
        }
    }

    function showStatus(msg) {
        let statusDiv = document.querySelector('.upload-status');
        if (!statusDiv) {
            statusDiv = document.createElement('div');
            statusDiv.className = 'upload-status';
            document.body.appendChild(statusDiv);
        }
        statusDiv.innerText = msg;
        statusDiv.style.display = 'block';
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 2000);
    }

    async function handleImageUpload(file) {
        if (!file.type.startsWith('image/')) {
            alert('Можно загружать только фото');
            return;
        }
        
        showStatus('📤 Загрузка фото...');
        
        try {
            const imageUrl = await uploadImage(file);
            const caption = messageInput.value.trim();
            sendImageMessage(imageUrl, caption);
            messageInput.value = '';
            showStatus('✅ Фото отправлено!');
        } catch (err) {
            console.error(err);
            alert('Ошибка загрузки фото, попробуй ещё раз');
            showStatus('❌ Ошибка загрузки');
        }
    }

    function connectWebSocket() {
        const room = 'chgasaken_photo_working';
        const wsUrl = `wss://relay.widgetbot.io/v1/${room}`;
        if (ws) ws.close();
        ws = new WebSocket(wsUrl);
        
        ws.onopen = () => {
            console.log('✅ WebSocket открыт');
            sendWsMessage('join', { username: currentUser });
        };
        
        ws.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                if (data.type === 'msg') {
                    const isOwn = data.username === currentUser;
                    if (data.image) {
                        addMessage(data.text || '', data.username, isOwn, data.time, data.image);
                    } else {
                        addMessage(data.text, data.username, isOwn, data.time);
                    }
                } else if (data.type === 'join') {
                    if (data.username !== currentUser) addSystemMessage(`✨ ${data.username} присоединился`);
                } else if (data.type === 'typing') {
                    if (data.username !== currentUser) showTyping(data.username);
                } else if (data.type === 'leave') {
                    if (data.username !== currentUser) addSystemMessage(`◌ ${data.username} покинул чат`);
                }
            } catch(err) {}
        };
        
        ws.onclose = () => {
            if (currentUser) {
                reconnectTimer = setTimeout(() => connectWebSocket(), 2000);
            }
        };
    }

    function enterChat() {
        const name = usernameInput.value.trim();
        if (!name) {
            alert('Введите имя');
            return;
        }
        if (name.length > 24) {
            alert('Имя слишком длинное');
            return;
        }
        currentUser = name;
        chatUserNameSpan.innerText = currentUser;
        avatarSpan.innerText = currentUser[0].toUpperCase();
        
        messagesContainer.innerHTML = '<div class="system-message">✨ Добро пожаловать в ЧГсакен ✨</div>';
        typingArea.innerText = '';
        
        connectWebSocket();
        
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        setTimeout(() => messageInput.focus(), 100);
    }

    function logout() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            sendWsMessage('leave', { username: currentUser });
            ws.close();
        }
        currentUser = null;
        if (reconnectTimer) clearTimeout(reconnectTimer);
        loginScreen.style.display = 'flex';
        chatScreen.style.display = 'none';
        messageInput.value = '';
        messagesContainer.innerHTML = '<div class="system-message">✨ Добро пожаловать в ЧГсакен ✨</div>';
    }

    function handleSendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('Соединение... подожди секунду');
            return;
        }
        sendTextMessage(text);
        messageInput.value = '';
        typingArea.innerText = '';
    }

    let lastTyping = 0;
    function onTyping() {
        if (!currentUser) return;
        const now = Date.now();
        if (now - lastTyping > 1500) {
            lastTyping = now;
            sendTyping();
        }
    }

    // События
    joinBtn.onclick = enterChat;
    logoutBtn.onclick = logout;
    sendBtn.onclick = handleSendMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') handleSendMessage(); };
    messageInput.oninput = onTyping;
    
    attachBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
        if (e.target.files.length) handleImageUpload(e.target.files[0]);
        fileInput.value = '';
    };
    
    usernameInput.focus();
</script>
</body>
</html>
