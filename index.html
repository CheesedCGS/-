<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>ЧГсакен — рабочий чат с фото</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100dvh;
            overflow: hidden;
            width: 100%;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            background: #0f0f0f;
        }

        .screen-login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: #0f0f0f;
            padding: 24px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo-icon {
            font-size: 64px;
            margin-bottom: 12px;
        }

        .logo-area h1 {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
        }

        .logo-area p {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 6px;
        }

        .input-field {
            width: 100%;
            background: #1c1c1e;
            border: none;
            border-radius: 14px;
            padding: 15px 18px;
            font-size: 17px;
            color: white;
            margin-bottom: 16px;
            outline: none;
        }

        .tg-btn {
            background: #fff;
            color: #000;
            font-weight: 600;
            font-size: 17px;
            border: none;
            border-radius: 14px;
            padding: 14px;
            width: 100%;
            cursor: pointer;
        }

        .screen-chat {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #000;
        }

        .chat-header {
            background: #0f0f0f;
            padding: 10px 16px;
            border-bottom: 0.33px solid rgba(84, 84, 88, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: #2c2c2e;
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: white;
        }

        .user-info .name {
            font-size: 17px;
            font-weight: 600;
            color: white;
        }

        .user-info .status {
            font-size: 13px;
            color: #34c759;
        }

        .logout-icon {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #ff453a;
            padding: 8px;
        }

        .messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #000;
        }

        .message-bubble {
            max-width: 82%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 15px;
            word-wrap: break-word;
        }

        .my-message {
            background: #2c2c2e;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        .other-message {
            background: #1c1c1e;
            color: #e5e5ea;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        .message-sender {
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            margin-bottom: 4px;
        }

        .message-img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 14px;
            margin-top: 6px;
            cursor: pointer;
            object-fit: cover;
        }

        .message-time {
            font-size: 10px;
            color: #6c6c70;
            text-align: right;
            margin-top: 4px;
        }

        .system-message {
            text-align: center;
            font-size: 12px;
            color: #6c6c70;
            margin: 8px auto;
        }

        .input-panel {
            background: #0f0f0f;
            padding: 10px 12px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 0.33px solid rgba(84, 84, 88, 0.3);
        }

        .attach-btn {
            background: #2c2c2e;
            width: 42px;
            height: 42px;
            border-radius: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            border: none;
            color: white;
        }

        .message-input {
            flex: 1;
            background: #1c1c1e;
            border: none;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 16px;
            color: white;
            outline: none;
        }

        .send-circle {
            background: #2c2c2e;
            width: 42px;
            height: 42px;
            border-radius: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .send-icon {
            font-size: 18px;
            color: white;
            transform: rotate(45deg);
        }

        .status-toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2c2e;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
            display: none;
        }

        @media (max-width: 480px) {
            .message-bubble { max-width: 88%; }
        }
    </style>
    <!-- PeerJS для P2P соединения между пользователями -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
<div class="app">
    <div id="loginScreen" class="screen-login">
        <div class="logo-area">
            <div class="logo-icon">📸</div>
            <h1>ЧГсакен</h1>
            <p>текст + фото · P2P чат</p>
        </div>
        <input type="text" id="usernameInput" class="input-field" placeholder="Твоё имя" maxlength="24">
        <button id="joinBtn" class="tg-btn">Войти в чат →</button>
        <div style="font-size: 11px; color: #636366; margin-top: 16px;">⚡ peer-to-peer, фото работают</div>
    </div>

    <div id="chatScreen" class="screen-chat">
        <div class="chat-header">
            <div class="user-badge">
                <div class="avatar" id="avatar">😎</div>
                <div class="user-info">
                    <div class="name" id="chatUserName">ЧГсакен</div>
                    <div class="status" id="connectionStatus">🔗 подключение...</div>
                </div>
            </div>
            <button id="logoutBtn" class="logout-icon">🚪</button>
        </div>

        <div id="messagesContainer" class="messages-list">
            <div class="system-message">✨ Отправляй текст или фото ✨</div>
        </div>

        <div class="input-panel">
            <label class="attach-btn" id="attachBtn">📎
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </label>
            <input type="text" id="messageInput" class="message-input" placeholder="Сообщение">
            <div id="sendBtn" class="send-circle">
                <span class="send-icon">➤</span>
            </div>
        </div>
    </div>
    <div id="statusToast" class="status-toast"></div>
</div>

<script>
    // ===== ЧГсакен на PeerJS (работает везде, без сервера) =====
    let currentUser = null;
    let peer = null;
    let connections = []; // все подключения
    let myPeerId = null;
    
    // DOM элементы
    const loginScreen = document.getElementById('loginScreen');
    const chatScreen = document.getElementById('chatScreen');
    const usernameInput = document.getElementById('usernameInput');
    const joinBtn = document.getElementById('joinBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatUserNameSpan = document.getElementById('chatUserName');
    const avatarSpan = document.getElementById('avatar');
    const connectionStatusSpan = document.getElementById('connectionStatus');
    const fileInput = document.getElementById('fileInput');
    const attachBtn = document.getElementById('attachBtn');
    const statusToast = document.getElementById('statusToast');

    function showToast(msg, duration = 2000) {
        statusToast.innerText = msg;
        statusToast.style.display = 'block';
        setTimeout(() => {
            statusToast.style.display = 'none';
        }, duration);
    }

    function formatTime() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'system-message';
        div.innerText = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        if (messagesContainer.children.length === 1 && messagesContainer.children[0].innerText.includes('Добро пожаловать')) {
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(div);
        }
    }

    function addMessage(text, sender, isOwn, time, imageUrl = null) {
        const timeStr = time || formatTime();
        const messageDiv = document.createElement('div');
        messageDiv.className = `message-bubble ${isOwn ? 'my-message' : 'other-message'}`;
        
        if (!isOwn) {
            const senderSpan = document.createElement('div');
            senderSpan.className = 'message-sender';
            senderSpan.innerText = sender;
            messageDiv.appendChild(senderSpan);
        }
        
        if (imageUrl) {
            const img = document.createElement('img');
            img.src = imageUrl;
            img.className = 'message-img';
            img.onclick = () => window.open(imageUrl, '_blank');
            messageDiv.appendChild(img);
        }
        
        if (text && text.trim()) {
            const textSpan = document.createElement('div');
            textSpan.innerText = text;
            messageDiv.appendChild(textSpan);
        }
        
        const timeSpan = document.createElement('div');
        timeSpan.className = 'message-time';
        timeSpan.innerText = timeStr;
        messageDiv.appendChild(timeSpan);
        
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        
        if (messagesContainer.children.length === 1 && messagesContainer.children[0].classList?.contains('system-message')) {
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(messageDiv);
        }
    }

    // Отправка всем подключённым
    function broadcast(data) {
        connections.forEach(conn => {
            if (conn.open) {
                conn.send(data);
            }
        });
    }

    // Отправка сообщения
    function sendChatMessage(text, imageUrl = null) {
        const messageData = {
            type: 'message',
            username: currentUser,
            text: text || '',
            image: imageUrl,
            time: formatTime()
        };
        // Показать у себя
        if (imageUrl) {
            addMessage(text || '', currentUser, true, formatTime(), imageUrl);
        } else {
            addMessage(text, currentUser, true, formatTime());
        }
        // Отправить другим
        broadcast(messageData);
    }

    // Загрузка фото на imgbb
    async function uploadImage(file) {
        const formData = new FormData();
        formData.append('image', file);
        const apiKey = '6d207e02198a847aa98d0a2a901485a5';
        const url = `https://api.imgbb.com/1/upload?key=${apiKey}`;
        
        const response = await fetch(url, { method: 'POST', body: formData });
        const data = await response.json();
        if (data.success) {
            return data.data.url;
        } else {
            throw new Error('Upload failed');
        }
    }

    async function handleImageUpload(file) {
        if (!file.type.startsWith('image/')) {
            alert('Можно загружать только фото');
            return;
        }
        showToast('📤 Загрузка фото...');
        try {
            const imageUrl = await uploadImage(file);
            const caption = messageInput.value.trim();
            sendChatMessage(caption, imageUrl);
            messageInput.value = '';
            showToast('✅ Фото отправлено!');
        } catch (err) {
            console.error(err);
            alert('Ошибка загрузки фото');
            showToast('❌ Ошибка');
        }
    }

    // Инициализация PeerJS
    function initPeer() {
        peer = new Peer();
        
        peer.on('open', (id) => {
            myPeerId = id;
            console.log('Мой Peer ID:', id);
            connectionStatusSpan.innerText = '🟢 онлайн';
            showToast('✅ Чат готов! Дай друзьям ссылку');
            
            // Сохраняем ID в localStorage для авто-подключения
            localStorage.setItem('chg_peerId', id);
            localStorage.setItem('chg_username', currentUser);
            
            // Пытаемся подключиться к сохранённым пирам
            connectToSavedPeers();
        });
        
        peer.on('connection', (conn) => {
            setupConnection(conn);
        });
        
        peer.on('error', (err) => {
            console.error('Peer error:', err);
            connectionStatusSpan.innerText = '⚠️ ошибка';
        });
    }
    
    function setupConnection(conn) {
        connections.push(conn);
        
        conn.on('open', () => {
            console.log('Подключен к:', conn.peer);
            // Отправить приветствие
            conn.send({
                type: 'join',
                username: currentUser,
                text: `${currentUser} присоединился`
            });
        });
        
        conn.on('data', (data) => {
            if (data.type === 'message') {
                const isOwn = data.username === currentUser;
                if (data.image) {
                    addMessage(data.text || '', data.username, isOwn, data.time, data.image);
                } else {
                    addMessage(data.text, data.username, isOwn, data.time);
                }
            } else if (data.type === 'join') {
                if (data.username !== currentUser) {
                    addSystemMessage(`✨ ${data.username} присоединился`);
                }
            }
        });
        
        conn.on('close', () => {
            const index = connections.indexOf(conn);
            if (index > -1) connections.splice(index, 1);
        });
    }
    
    function connectToPeer(peerId) {
        if (peerId === myPeerId) return;
        // Проверяем, уже подключены
        if (connections.some(c => c.peer === peerId)) return;
        
        const conn = peer.connect(peerId);
        setupConnection(conn);
    }
    
    function connectToSavedPeers() {
        // В реальном P2P нужно знать ID других пользователей
        // Для простоты сделаем комнату через localStorage (для одной вкладки)
        // Но между разными людьми нужно обмениваться ссылками
        // Добавим кнопку копирования ссылки
    }
    
    // Поделиться ссылкой-приглашением
    function shareInvite() {
        const inviteUrl = `${window.location.href}?invite=${myPeerId}`;
        navigator.clipboard.writeText(inviteUrl);
        showToast('🔗 Ссылка-приглашение скопирована! Отправь другу');
    }
    
    // Проверка URL на приглашение
    function checkInvite() {
        const params = new URLSearchParams(window.location.search);
        const inviteId = params.get('invite');
        if (inviteId && myPeerId && inviteId !== myPeerId) {
            setTimeout(() => {
                connectToPeer(inviteId);
                showToast('🔌 Подключение к пригласившему...');
            }, 1000);
        }
    }
    
    function enterChat() {
        const name = usernameInput.value.trim();
        if (!name) {
            alert('Введите имя');
            return;
        }
        if (name.length > 24) {
            alert('Имя слишком длинное');
            return;
        }
        currentUser = name;
        chatUserNameSpan.innerText = currentUser;
        avatarSpan.innerText = currentUser[0].toUpperCase();
        
        messagesContainer.innerHTML = '<div class="system-message">✨ Добро пожаловать в ЧГсакен ✨</div>';
        
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        
        initPeer();
        
        // Добавляем кнопку приглашения в шапку
        const headerDiv = document.querySelector('.chat-header');
        if (!document.getElementById('inviteBtn')) {
            const inviteBtn = document.createElement('button');
            inviteBtn.id = 'inviteBtn';
            inviteBtn.innerText = '➕';
            inviteBtn.style.background = '#2c2c2e';
            inviteBtn.style.border = 'none';
            inviteBtn.style.color = 'white';
            inviteBtn.style.fontSize = '18px';
            inviteBtn.style.width = '36px';
            inviteBtn.style.height = '36px';
            inviteBtn.style.borderRadius = '36px';
            inviteBtn.style.cursor = 'pointer';
            inviteBtn.onclick = shareInvite;
            headerDiv.appendChild(inviteBtn);
        }
        
        setTimeout(() => {
            checkInvite();
        }, 1500);
    }
    
    function logout() {
        if (peer) peer.destroy();
        connections = [];
        currentUser = null;
        loginScreen.style.display = 'flex';
        chatScreen.style.display = 'none';
        messageInput.value = '';
        messagesContainer.innerHTML = '<div class="system-message">✨ Добро пожаловать в ЧГсакен ✨</div>';
        localStorage.removeItem('chg_peerId');
        localStorage.removeItem('chg_username');
    }
    
    function handleSendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        sendChatMessage(text);
        messageInput.value = '';
    }
    
    // События
    joinBtn.onclick = enterChat;
    logoutBtn.onclick = logout;
    sendBtn.onclick = handleSendMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') handleSendMessage(); };
    
    attachBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
        if (e.target.files.length) handleImageUpload(e.target.files[0]);
        fileInput.value = '';
    };
    
    usernameInput.focus();
</script>
</body>
</html>
